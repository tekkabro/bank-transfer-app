spring.application.name=bank-transfer-app 
spring.datasource.url=jdbc:mysql://localhost:3307/bank_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging to observe transaction commits and rollbacks
logging.level.org.springframework.transaction=DEBUG
logging.level.org.hibernate.SQL=DEBUG