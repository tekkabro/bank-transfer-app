<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1-scale=1">
    <title>Bank Transfer System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Bank Transfer System</h1>

    <div th:if="${successMessage}" class="alert success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}"></div>

    <div class="stats">
        <p>Total Bank Balance: <strong th:text="${totalBalance}">0.00</strong> LKR</p>
        <p>Successful Transfers: <span th:text="${successCount}">0</span> | Failed Transfers: <span th:text="${failedCount}">0</span></p>
    </div>

    <div class="grid">
        <!-- Transfer Form -->
        <div class="card">
            <h2>Make a Transfer</h2>
            <form th:action="@{/transfer}" th:object="${transferRequest}" method="post">
                <label>From Account:</label>
                <input type="text" th:field="*{fromAccount}" placeholder="e.g. 100001"/>

                <label>To Account:</label>
                <input type="text" th:field="*{toAccount}" placeholder="e.g. 100002"/>

                <label>Amount (LKR):</label>
                <input type="number" step="0.01" th:field="*{amount}" placeholder="0.00"/>

                <div class="checkbox-group">
                    <input type="checkbox" th:field="*{simulateFailure}" id="failCheck"/>
                    <label for="failCheck">Simulate system failure</label>
                </div>

                <button type="submit">Transfer Money</button>
            </form>
        </div>

        <!-- Add Customer Form -->
        <div class="card">
            <h2>Add Customer</h2>
            <form th:action="@{/customers}" th:object="${newCustomer}" method="post">
                <label>Account Number:</label>
                <input type="text" th:field="*{accountNumber}"/>

                <label>Full Name:</label>
                <input type="text" th:field="*{fullName}"/>

                <label>Email:</label>
                <input type="email" th:field="*{email}"/>

                <label>Initial Balance:</label>
                <input type="number" step="0.01" th:field="*{balance}"/>

                <button type="submit">Add Customer</button>
            </form>
        </div>
    </div>

    <!-- Customer Table & Search -->
    <div class="section">
        <h2>Customers</h2>
        <form method="get" th:action="@{/}">
            <input type="text" name="keyword" th:value="${param.keyword}" placeholder="Search by name or account..."/>
            <button type="submit">Search</button>
        </form>
        <table>
            <thead>
            <tr><th>Account</th><th>Name</th><th>Email</th><th>Balance (LKR)</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${customers}">
                <td th:text="${c.accountNumber}"></td>
                <td th:text="${c.fullName}"></td>
                <td th:text="${c.email}"></td>
                <td th:text="${c.balance}"></td>
                <td><a th:href="@{/accounts/{acc}/history(acc=${c.accountNumber})}">View History</a></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Latest Transactions -->
    <div class="section">
        <h2>Latest Transactions</h2>
        <table>
            <thead>
            <tr><th>ID</th><th>From</th><th>To</th><th>Amount</th><th>Status</th><th>Description</th><th>Time</th></tr>
            </thead>
            <tbody>
            <tr th:each="t : ${latestTransactions}">
                <td th:text="${t.id}"></td>
                <td th:text="${t.fromAccount}"></td>
                <td th:text="${t.toAccount}"></td>
                <td th:text="${t.amount}"></td>
                <td th:text="${t.status}" th:class="${t.status.name() == 'SUCCESS' ? 'success-text' : 'failed-text'}"></td>
                <td th:text="${t.description}"></td>
                <td th:text="${t.createdAt}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
